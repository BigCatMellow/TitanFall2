const $=id=>document.getElementById(id), canvas=$('map'), ctx=canvas.getContext('2d');

const colors={2:'#69adff',3:'#ff8189'};const color=p=>!p.alive?'#667485':!p.bot?'#fff':colors[p.team]||'#a4b4c7';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chooseRound(){current=+$('round').value;index=0;selected='all';const r=rounds[current];$('scrub').max=r.frames.length-1;$('scrub').value=0;$('bot').innerHTML='<option value="all">All bots</option>'+[...new Set(r.rows.filter(p=>p.bot).map(p=>p.slot))].sort((a,b)=>a-b).map(s=>`<option value="${s}">Bot #${s}</option>`).join('');draw()}
$('round').innerHTML=rounds.map((r,i)=>`<option value="${i}">${esc(r.map)} · round ${r.epoch}</option>`).join('');$('round').onchange=chooseRound;
$('scrub').oninput=()=>{index=+$('scrub').value;draw()};$('bot').onchange=()=>{selected=$('bot').value;draw()};$('targets').onchange=draw;$('refresh').onclick=()=>location.reload();
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play 10×'};
function animate(now){if(playing&&now-lastStep>200){lastStep=now;index=(index+1)%rounds[current].frames.length;$('scrub').value=index;draw()}requestAnimationFrame(animate)}
function draw(){const r=rounds[current],f=r.frames[index];if(!f)return;const box=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const w=box.width,h=box.height;
const bounds=r.rows.reduce((b,p)=>[Math.min(b[0],p.x),Math.max(b[1],p.x),Math.min(b[2],p.y),Math.max(b[3],p.y)],[Infinity,-Infinity,Infinity,-Infinity]);let minX=bounds[0]-200,maxX=bounds[1]+200,minY=bounds[2]-200,maxY=bounds[3]+200;const scale=Math.min((w-60)/(maxX-minX),(h-60)/(maxY-minY));const ox=(w-(maxX-minX)*scale)/2,oy=(h-(maxY-minY)*scale)/2;const pt=(x,y)=>[ox+(x-minX)*scale,h-oy-(y-minY)*scale];ctx.clearRect(0,0,w,h);ctx.strokeStyle='#26374c';ctx.lineWidth=1;
for(let x=Math.ceil(minX/500)*500;x<maxX;x+=500){const a=pt(x,minY),b=pt(x,maxY);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}for(let y=Math.ceil(minY/500)*500;y<maxY;y+=500){const a=pt(minX,y),b=pt(maxX,y);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}

for(const path of trails.values()){ctx.strokeStyle=color(path.at(-1));ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.beginPath();let started=false;for(const p of path){if(!p.alive){started=false;continue}const xy=pt(p.x,p.y);if(!started){ctx.moveTo(...xy);started=true}else ctx.lineTo(...xy)}ctx.stroke()}ctx.globalAlpha=1;

$('stats').innerHTML=[[bots.length,'Bots in this sample'],[recover,'Recovery attempts so far'],[fail,'Failed route queries so far'],[stall,'Low movement flags']].map(([v,k])=>`<div class="card"><b>${v}</b><span>${k}</span></div>`).join('');
$('roster').innerHTML=bots.sort((a,b)=>a.slot-b.slot).map(p=>`<tr data-slot="${p.slot}" class="${String(p.slot)===selected?'selected':''}"><td style="color:${color(p)}">#${p.slot}${p.titan?' T':''}</td><td>${p.hp}</td><td>${esc(p.state)}</td><td>${p.target===-1?'—':p.target}</td></tr>`).join('');for(const tr of $('roster').querySelectorAll('tr'))tr.onclick=()=>{selected=tr.dataset.slot;$('bot').value=selected;draw()};
const chosen=bots.find(p=>String(p.slot)===selected);$('details').textContent=chosen?`Bot #${chosen.slot} · team ${chosen.team} · ${chosen.alive?'alive':'dead'}\nTarget ${chosen.target} · ${chosen.visible?'visible':'not visible'}\nSwitches ${chosen.switches} · recoveries ${chosen.recoveries}\nRoutes ${chosen.path_requests} · failed ${chosen.path_failures}\nNearby allies ${chosen.near_allies} · spacing commands ${chosen.spacing}\nPosition ${chosen.x.toFixed(0)}, ${chosen.y.toFixed(0)}, ${chosen.z.toFixed(0)}`:'Select a bot to inspect its decisions and route history.';
const s=SESSION.summary.find(s=>s.epoch===r.epoch&&s.map===r.map);$('summary').textContent=s?`Round summary: ${s.bot_slots} bot slots · ${s.observations} observations · ${s.switches} target switches · ${s.recoveries} recoveries · ${s.stalled_observations} low movement observations.`:'';
}
canvas.onclick=event=>{const b=canvas.getBoundingClientRect(),x=event.clientX-b.left,y=event.clientY-b.top;let best=null,dist=22;for(const h of hitPoints){const d=Math.hypot(x-h.x,y-h.y);if(h.p.bot&&d<dist){dist=d;best=h.p}}if(best){selected=String(best.slot);$('bot').value=selected;draw()}};
